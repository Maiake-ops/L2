# /etc/rcl2.conf - L2 live and installed system
hostname L2
klog 4
ctrlaltdel poweroff

# tty1 is always present.  The serial getty only starts a shell if the UART
# really exists (a laptop has none), so there is no respawn spam on real HW.
service tty1  respawn /sbin/rcl2 console /dev/tty1
service ttyS0 respawn /bin/dash /etc/l2/serial-getty ttyS0

# Network bring-up: loads wifi/NIC modules only if the hardware is present,
# so a machine with no network costs nothing.  See /bin/l2net and /etc/l2/net.conf.
service net   once    /bin/dash /bin/l2net boot
