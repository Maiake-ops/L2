# Limine configuration for the L2 live ISO (BIOS + UEFI).
# @CMDLINE@ is replaced by `l2 iso` with config/cmdline.
# boot() is the ISO9660 volume; kernel and initramfs are read from it.
#
# console=tty0 is LAST on purpose: the last console= becomes /dev/console, so
# on a laptop with no UART init still talks to the screen, while a serial
# cable (or QEMU -nographic) still sees the kernel log and a getty on ttyS0.
timeout: 3
default_entry: 1
interface_branding: L2 - tiny Linux for tools
term_background: 0d1117
term_foreground: 7ebae4

/L2 live
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: rdinit=/init console=ttyS0,115200 console=tty0 @CMDLINE@
    module_path: boot():/boot/initramfs

/L2 live - recovery shell
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: rdinit=/init l2.rescue=1 console=ttyS0,115200 console=tty0 @CMDLINE@
    module_path: boot():/boot/initramfs

/L2 live - cap RAM at 1 GiB (smallest kernel overhead on big machines)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: rdinit=/init mem=1G console=ttyS0,115200 console=tty0 @CMDLINE@
    module_path: boot():/boot/initramfs

/L2 live - cap RAM at 256 MiB (kernel page tables ~4 MiB instead of ~1.5% of RAM)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: rdinit=/init mem=256M console=ttyS0,115200 console=tty0 @CMDLINE@
    module_path: boot():/boot/initramfs
