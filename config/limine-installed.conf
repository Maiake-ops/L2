# Limine configuration for an installed L2 disk (written by l2install).
# @ROOT_PARTUUID@ and @CMDLINE@ are substituted at install time.
#
# Limine only reads FAT32/ISO9660, so this file, the kernel and the recovery
# initramfs live on the FAT32 ESP; boot() is that partition.  The normal entry
# has NO initramfs: the kernel mounts the ext4 root itself (all storage
# drivers and ext4 are built in), so nothing but the real root occupies RAM.
timeout: 3
default_entry: 1
interface_branding: L2 - tiny Linux for tools
term_background: 0d1117
term_foreground: 7ebae4

/L2
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: root=PARTUUID=@ROOT_PARTUUID@ rootwait rw rootfstype=ext4 init=/sbin/rcl2 console=tty0 console=ttyS0,115200 @CMDLINE@

/L2 - recovery shell (disk)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: root=PARTUUID=@ROOT_PARTUUID@ rootwait rw rootfstype=ext4 init=/sbin/rcl2 l2.rescue=1 console=tty0 console=ttyS0,115200 @CMDLINE@

/L2 - RAM-only rescue (initramfs, does not touch the disk)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: rdinit=/init console=tty0 console=ttyS0,115200 @CMDLINE@
    module_path: boot():/boot/initramfs
