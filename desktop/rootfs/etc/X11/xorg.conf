Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
EndSection
Section "Module"
    Disable "glx"
EndSection
Section "Device"
    Identifier "Framebuffer"
    Driver "fbdev"
EndSection
Section "Screen"
    Identifier "Screen"
    Device "Framebuffer"
EndSection
