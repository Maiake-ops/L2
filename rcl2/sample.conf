# /etc/rcl2.conf - example for the L2 distro (drop-in for s6's boot services)
#
# grammar: one directive per line, "#" comments, whitespace-separated.
#   hostname NAME
#   klog N              console loglevel, optional, 0 = kernel default
#   setenv KEY=VALUE    extra env (default: PATH/HOME/USER/TERM/PS1)
#   ctrlaltdel reboot|poweroff
#   service NAME (once|respawn|wait) PATH [ARGS...]
#     respawn = supervised, restarted with 1s..30s backoff
#     once    = start it, log the exit, move on
#     wait    = start it and block at boot until it exits (rc-script style)

hostname L2

# console gettys via rcl2's own console mode
# Both are respawn, never wait: a getty runs for the whole session, so wait
# would block boot before later services start. Pick the console(s) you want;
# do not list the same device twice.
service tty1   respawn /sbin/rcl2 console /dev/tty1
service ttyS0  respawn /sbin/rcl2 console /dev/ttyS0

# hotplug daemon (s6 equivalent of "mdev -s" + daemon)
service mdev   respawn /sbin/mdev -df

# bring loopback up: direct exec, no shell in between
service lo     once    /sbin/ip link set lo up

# network service example (commented; see README for respawn semantics)
# service net   respawn /bin/sh /etc/rcl2/net.sh
